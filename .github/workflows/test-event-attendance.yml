name: Test event attendance
on:
  pull_request:
    paths:
      - 'apps/grandmajazz-platform/server/events/**'
      - 'apps/grandmajazz-platform/tests/quiz-host.test.ts'
      - '.github/workflows/test-event-attendance.yml'
permissions:
  contents: read
jobs:
  event-attendance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/grandmajazz-platform/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - working-directory: apps/grandmajazz-platform
        run: npm ci
      - working-directory: apps/grandmajazz-platform
        run: npx vitest run --config vitest.quiz-host.config.ts
