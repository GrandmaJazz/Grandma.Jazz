name: Test platform validation

on:
  pull_request:
    paths:
      - 'apps/grandmajazz-platform/**'
      - 'shared/site/**'
      - 'src/components/CarouselSpeedControl.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-platform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/grandmajazz-platform/**'
      - 'shared/site/**'
      - 'src/components/CarouselSpeedControl.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-platform-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/grandmajazz-platform/package-lock.json
      - name: Install shared website dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Install platform dependencies
        working-directory: apps/grandmajazz-platform
        run: npm ci --ignore-scripts --include=dev
      - name: Check platform types
        working-directory: apps/grandmajazz-platform
        run: npm run check
      - name: Check validation and mocked signup flows
        working-directory: apps/grandmajazz-platform
        env:
          TEST_DATABASE_URL: postgres://invalid:invalid@127.0.0.1:1/isolated_no_connection
        run: >-
          npm test --
          tests/validation-compatibility.test.ts
          tests/family-signup.test.ts
          tests/family-marketing-choice.test.ts
          tests/family-email-identity.test.ts
          tests/family-signup-storage.test.ts
          tests/events-family-identity.test.ts
          tests/garments.test.ts
          tests/garments-layout.test.ts
          tests/garments-runtime.test.ts
      - name: Build platform, original Family Wall and backend
        working-directory: apps/grandmajazz-platform
        run: node --import tsx script/build.ts
