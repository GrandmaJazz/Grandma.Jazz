name: Test website

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.js'
      - 'tailwind.config.ts'
      - 'apps/grandmajazz-platform/client/src/family-original/**'
      - '.github/workflows/test-website.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.js'
      - 'tailwind.config.ts'
      - 'apps/grandmajazz-platform/client/src/family-original/**'
      - '.github/workflows/test-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install website dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Check website types
        run: npx tsc --noEmit
      - name: Run website regressions
        run: npm test
