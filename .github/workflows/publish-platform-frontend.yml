name: Publish platform frontend

on:
  push:
    branches: [main]
    paths:
      - 'shared/site/**'
      - 'src/lib/businessDetails.ts'
      - 'apps/grandmajazz-platform/client/**'
      - '!apps/grandmajazz-platform/client/src/family-original/**'
      - '!apps/grandmajazz-platform/client/family-wall.html'
      - '!apps/grandmajazz-platform/client/public/family-wall/**'
      - 'apps/grandmajazz-platform/vite*.ts'
      - 'apps/grandmajazz-platform/package*.json'
      - 'apps/grandmajazz-platform/shared/**'
      - 'apps/grandmajazz-platform/script/build.ts'
      - 'apps/grandmajazz-platform/script/publish-frontend.sh'
      - '.github/workflows/publish-platform-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-frontend-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/grandmajazz-platform/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Build platform
        working-directory: apps/grandmajazz-platform
        run: |
          npm ci
          ln -s apps/grandmajazz-platform/node_modules ../../node_modules
          npm run build
          node --test tests/family-runtime-build.test.mjs
      - name: Publish and verify
        env:
          DEPLOY_KEY: ${{ secrets.GJ_PLATFORM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.GJ_PLATFORM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(git rev-parse HEAD)
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$release" != "$current" ]]; then
            echo "::notice::main moved during the build. Fetching the latest source before publishing."
            git fetch --depth=1 origin refs/heads/main
            if ! git diff --quiet "$release" FETCH_HEAD -- shared/site src/lib/businessDetails.ts \
              apps/grandmajazz-platform/client apps/grandmajazz-platform/shared \
              'apps/grandmajazz-platform/vite*.ts' 'apps/grandmajazz-platform/package*.json' \
              apps/grandmajazz-platform/script/build.ts apps/grandmajazz-platform/script/publish-frontend.sh \
              .github/workflows/publish-platform-frontend.yml \
              ':(exclude)apps/grandmajazz-platform/client/src/family-original/**' \
              ':(exclude)apps/grandmajazz-platform/client/family-wall.html' \
              ':(exclude)apps/grandmajazz-platform/client/public/family-wall/**'; then
              echo "::notice::A newer platform change superseded this build. Skipping the old bundle."
              exit 0
            fi
          fi
          if [[ -z "$DEPLOY_KEY" || -z "$KNOWN_HOSTS" ]]; then
            echo "::error::The VPS deploy key and pinned host key need to be configured once in repository Actions secrets."
            exit 1
          fi
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$config/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$config/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          public=apps/grandmajazz-platform/dist/public
          tar -C "$public" -czf - index.html assets |
            ssh -F /dev/null -T -i "$config/key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$config/known_hosts" -o ConnectTimeout=15 \
              grandmajazz@185.111.159.228
          entry=$(grep -oE '/assets/index-[A-Za-z0-9_-]+[.]js' "$public/index.html")
          for path in '/api/platform-page/events/' '/garments/'; do
            html=$(curl -fsSL --retry 3 --retry-all-errors --max-time 20 "https://www.grandmajazz.com${path}?embedded=1&release=$release")
            grep -Fq "$entry" <<< "$html"
          done
          curl -fsSL --retry 3 --retry-all-errors --max-time 20 "https://www.grandmajazz.com$entry" -o /dev/null
          curl -fsSL --retry 3 --retry-all-errors --max-time 20 "https://www.grandmajazz.com/family-wall/" -o /dev/null
