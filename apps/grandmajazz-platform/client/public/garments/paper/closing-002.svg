<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><title>Garments 002 closing: Somebody else will wear it again.</title><defs>
<radialGradient id="paper"><stop stop-color="#f7f3ee"/><stop offset=".75" stop-color="#f5f0e9"/><stop offset="1" stop-color="#efe8df"/></radialGradient>
<filter id="fibres" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".38 .7" numOctaves="3" seed="17"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .016" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/></filter>
<pattern id="flecks" width="83" height="97" patternUnits="userSpaceOnUse"><path d="M11 20l1 3m31 38l2-1m27-46l-1 2M24 86l3 1" stroke="#6e3a25" stroke-width=".8" opacity=".055"/></pattern>
<filter id="logoInk" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .431372549 0 0 0 0 .22745098 0 0 0 0 .145098039 -1.861313869 0 0 0 1.802919708" result="ink"/><feComposite in="ink" in2="SourceGraphic" operator="in"/></filter>
<filter id="wordmarkInk" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .431372549 0 0 0 0 .22745098 0 0 0 0 .145098039 -1.07142857 0 0 0 1.07142857" result="ink"/><feComposite in="ink" in2="SourceGraphic" operator="in"/></filter>
<filter id="emboss" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation=".8" result="soft"/><feOffset in="soft" dx="1.3" dy="1.7" result="low"/><feFlood flood-color="#47291c" flood-opacity=".24" result="shade"/><feComposite in="shade" in2="low" operator="in" result="shadow"/><feOffset in="soft" dx="-1" dy="-1.3" result="high"/><feFlood flood-color="#ffffff" flood-opacity=".7" result="light"/><feComposite in="light" in2="high" operator="in" result="highlight"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="highlight"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1080" height="1440" fill="url(#paper)"/>
<rect width="1080" height="1440" filter="url(#mottle)" opacity=".045" style="mix-blend-mode:multiply"/>
<rect width="1080" height="1440" filter="url(#fibres)" opacity=".06" style="mix-blend-mode:multiply"/>
<rect width="1080" height="1440" fill="url(#flecks)"/>
<g text-anchor="middle" fill="#6e3a25" font-family="Georgia, Times New Roman, serif"><text x="540" y="680" font-size="40">Somebody else</text><text x="540" y="742" font-size="40">will wear it again.</text><text x="540" y="823" font-family="Arial, sans-serif" font-size="17" letter-spacing="1.4" opacity=".72">With love, Grandma Jazz</text><g filter="url(#emboss)"><image x="450" y="887" width="180" height="180" filter="url(#logoInk)" href="garments-mark.png"/></g><image x="455" y="1202" width="170" height="36" filter="url(#wordmarkInk)" href="garments-wordmark.png"/><text x="540" y="1280" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.6" opacity=".65">VINTAGE. REWORN. CONTINUED.</text></g></svg>