<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <title>Garments closing note</title>
  <rect width="1080" height="1440" fill="#704631"/>
  <g fill="#f5f1e6" text-anchor="middle">
    <text x="540" y="710" font-family="Georgia, 'Times New Roman', serif" font-size="34">Thanks for giving this story</text>
    <text x="540" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="34">another chapter.</text>
    <text x="540" y="848" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" opacity=".72">With love, Grandma Jazz</text>
    <text x="540" y="1280" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.4" opacity=".48">VINTAGE. UPCYCLED. UNIQUELY FOUND.</text>
  </g>
</svg>
