<!doctype html><meta charset="utf-8"><title>Record layout check</title><style>body{margin:0;background:#242424;color:white;font:14px system-ui}nav{position:sticky;top:0;background:#242424;padding:12px;z-index:2}button{padding:10px;margin:4px}#stage{margin:auto;position:relative}iframe{border:0;display:block;transform-origin:top left}#status{padding:10px}</style><nav><span>Viewport:</span><select id="sizes"><option value="320,480">320 × 480</option><option value="390,664">390 × 664</option><option value="390,844">390 × 844</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390</option><option value="768,1024">768 × 1024</option><option value="820,1180">820 × 1180</option><option value="1024,1366">1024 × 1366</option><option value="1024,768">1024 × 768</option><option value="1366,1024">1366 × 1024</option><option value="1050,800">1050 × 800</option><option value="1440,900">1440 × 900</option></select><button id="reload">Reload</button><button id="play">Play centre album</button><button id="pause">Pause visuals</button><button id="resume">Resume</button><div id="status"></div></nav><main id="stage"><iframe id="site" title="Website under test"></iframe></main><script>
const frame=document.getElementById('site'),stage=document.getElementById('stage'),sizes=document.getElementById('sizes'),status=document.getElementById('status');let paused=false;
function resize(){const [w,h]=sizes.value.split(',').map(Number),scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';status.textContent=w+' × '+h+' · '+Math.round(scale*100)+'% preview';}
sizes.onchange=resize;resize();frame.src='/';document.getElementById('reload').onclick=()=>{paused=false;frame.src='/';};
document.getElementById('play').onclick=()=>{const doc=frame.contentDocument;const slides=[...doc.querySelectorAll('.swiper-slide')];const active=doc.querySelector('.swiper-slide-active');(active||slides[3])?.click();};
document.getElementById('pause').onclick=()=>{paused=true;};document.getElementById('resume').onclick=()=>{paused=false;};
frame.onload=()=>{const win=frame.contentWindow,raf=win.requestAnimationFrame.bind(win);win.requestAnimationFrame=callback=>raf(function tick(t){if(paused)raf(tick);else callback(t);});};
</script>
