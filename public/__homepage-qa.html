<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><title>Homepage responsive QA</title><style>body{margin:0;background:#333;color:white;font:14px system-ui}nav{padding:10px;position:sticky;top:0;z-index:5;background:#333}button{padding:8px;margin:3px}iframe{display:block;border:0;margin:0 auto;width:390px;height:844px;background:#0a0a0a}#stage{transform-origin:top left}</style></head><body><nav>Test viewport: <button data-w="320" data-h="700">320</button><button data-w="390" data-h="844">390</button><button data-w="1050" data-h="900">1050</button><button data-w="1440" data-h="1000">1440</button><span id="size">390 × 844</span><br><button data-y="0">Hero</button><button data-id="the-space">Space</button><button data-id="our-story">Story</button><button data-id="the-ritual">Counter</button><button data-heading="Oh, the things they say.">People</button><button data-id="event-booking">Sessions</button><button data-heading="Take a little home.">Shop</button><button data-heading="Come and find us.">Find us</button><button id="measure">Measure overflow</button><output id="result"></output></nav><div id="stage"><iframe title="Homepage QA viewport" src="/"></iframe></div><script>
const f=document.querySelector('iframe');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';document.querySelector('#size').textContent=b.dataset.w+' × '+b.dataset.h;});
document.querySelectorAll('[data-id],[data-heading],[data-y]').forEach(b=>b.onclick=()=>{if(b.dataset.y){f.contentWindow.scrollTo(0,0);return;}const d=f.contentDocument;const el=b.dataset.id?d.getElementById(b.dataset.id):Array.from(d.querySelectorAll('h2')).find(h=>h.textContent.trim()===b.dataset.heading);el?.scrollIntoView({block:'start'});});
document.querySelector('#measure').onclick=()=>{const d=f.contentDocument;document.querySelector('#result').textContent=JSON.stringify({viewport:f.contentWindow.innerWidth,document:d.documentElement.scrollWidth,body:d.body.scrollWidth});};
</script></body></html>
